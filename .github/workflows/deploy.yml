name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Caddy
        run: |
          # LAN address of the Caddy host, not reachable from the internet.
          rsync -av --delete \
            -e "ssh -i ~/.ssh/mjarlund_deploy" \
            ./build/ \
            deploy@192.168.1.190:/var/www/portfolio/
